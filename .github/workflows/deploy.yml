name: Deploy site

# Build the Zola site and publish it to the gh-pages branch
# (repo must have Pages → Deploy from a branch → gh-pages).

on:
  push:
    branches: [master]
    paths: ['website/**']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@zola
      - run: zola --root website build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website/public
