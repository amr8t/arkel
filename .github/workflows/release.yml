name: Release

# Cut a release: run ./scripts/release.sh <x.y.z> (fmt/clippy/test/build, then
# commit, tag, and push). Pushing the tag builds the release binary and
# publishes it to GitHub Releases.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Checksum
        run: |
          cd target/release
          sha256sum arkel > arkel.sha256
          cat arkel.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/arkel
            target/release/arkel.sha256
