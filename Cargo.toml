[package]
name = "arkel"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
anyhow = "1.0.102"
iroh = "1.0.0-rc.1"
iroh-blobs = "0.102.0"
openraft = { version = "0.9.24", features = ["serde"] }
async-trait = "0.1"
serde = "1.0.228"
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3.32"
