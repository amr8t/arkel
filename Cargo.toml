[package]
name = "arkel"
version = "0.0.4"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
axum = "0.7"
anyhow = "1.0.102"
iroh = "1.0.3"
iroh-blobs = "0.103.0"
openraft = { version = "0.10.0-alpha.21", features = ["serde", "type-alias"] }
openraft-rt = "0.10.0-alpha.21"
serde = "1.0.228"
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3.32"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde_cbor = "0.11.2"
blake3 = "1.8.5"
async-trait = "0.1.89"
reed-solomon-erasure = "6"  # wk 7, but add now
chacha20poly1305 = "0.10"   # wk 8
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4.3"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
clap-markdown = "0.1"

# CLI-docs generator declared as an example so it keeps dev-dependency (clap-markdown) access.
[[example]]
name = "gen_cli_docs"
path = "scripts/gen_cli_docs.rs"
