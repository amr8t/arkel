# Storage node config, mounted at /etc/arkel/arkel-node.toml.
#
# Set advertise_addr to the address clients can reach this node on
# (your public IP:port), capacity to the disk you commit, and
# earn_account to the account id (from `arkel identity`) that your
# contribution grant is credited to.
[storage]
addr = "0.0.0.0:9001"
advertise_addr = "<your-public-ip>:9001"
data_dir = "/var/lib/arkel"
index_addrs = ["http://index.pc1.arkeldata.com:8001"]
earn_account = "<your-account-id>"
capacity = "50GB"
gc_interval_secs = 3600
